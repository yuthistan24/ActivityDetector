# ==============================================================================
# DEFAULT DEMONSTRATION PROCEDURE: GENERIC OBJECT HANDLING (NOTEBOOK)
# ==============================================================================
# DISCLAIMER:
# This procedure is a tabletop demonstration of automated procedure monitoring
# and sequential state tracking using ordinary household objects (e.g. a notebook).
# It is an engineering prototype and is NOT flight-qualified or suitable for
# unsupervised mission-critical operations.
#
# Procedure Steps:
# 1. Locate and identify the selected object: notebook.
# 2. Open the notebook.
# 3. Close the notebook.
# 4. Move the closed notebook to a designated "stowed" area and leave it there.
# ==============================================================================

id: "notebook_handling_protocol_v1"
title: "Generic Object Handling Protocol: Notebook"
version: "1.0.0"
description: "Tabletop procedure monitoring protocol for generic object identification, state tracking (open/closed), and area stowage."
author: "Tabletop Procedure Monitoring Prototype"
target_object: "notebook"

steps:
  - id: "step_1_locate_notebook"
    order: 1
    name: "Locate & Identify Notebook"
    instruction: "Place the target notebook in the central workspace and ensure it is clearly visible to the camera."
    expected_evidence:
      target_object: "notebook"
      expected_state:
        object_visible: true
        location: "workspace_center"
      roi: "workspace_center"
      vlm_keywords:
        - "notebook"
        - "book"
        - "cover"
    completion_rule:
      rule_type: "vlm_state_tracking"
      min_vlm_samples: 2
      stable_frames: 8
      min_confidence: 0.65
      hold_seconds: 1.5
    timeout_seconds: 45.0

  - id: "step_2_open_notebook"
    order: 2
    name: "Open Notebook"
    instruction: "Open the notebook so the inner pages are face-up and visible on the workspace."
    expected_evidence:
      target_object: "notebook"
      expected_state:
        object_visible: true
        open_or_closed: "open"
        location: "workspace_center"
      roi: "workspace_center"
      vlm_keywords:
        - "open"
        - "pages"
        - "spread"
    completion_rule:
      rule_type: "vlm_state_tracking"
      min_vlm_samples: 2
      stable_frames: 8
      min_confidence: 0.65
      hold_seconds: 1.5
    timeout_seconds: 45.0
    prerequisites:
      - "step_1_locate_notebook"

  - id: "step_3_close_notebook"
    order: 3
    name: "Close Notebook"
    instruction: "Close the notebook so the front cover is face-up on the workspace."
    expected_evidence:
      target_object: "notebook"
      expected_state:
        object_visible: true
        open_or_closed: "closed"
        location: "workspace_center"
      roi: "workspace_center"
      vlm_keywords:
        - "closed"
        - "cover"
        - "shut"
    completion_rule:
      rule_type: "vlm_state_tracking"
      min_vlm_samples: 2
      stable_frames: 8
      min_confidence: 0.65
      hold_seconds: 1.5
    timeout_seconds: 45.0
    prerequisites:
      - "step_2_open_notebook"

  - id: "step_4_stow_notebook"
    order: 4
    name: "Transfer to Stowed Area"
    instruction: "Move the closed notebook into the designated stowed area on the right and leave it resting there."
    expected_evidence:
      target_object: "notebook"
      expected_state:
        object_visible: true
        open_or_closed: "closed"
        location: "stowed_area"
      roi: "stowed_area"
      vlm_keywords:
        - "stowed"
        - "stowage"
        - "right"
        - "dock"
    completion_rule:
      rule_type: "vlm_state_tracking"
      min_vlm_samples: 2
      stable_frames: 8
      min_confidence: 0.65
      hold_seconds: 2.0
    timeout_seconds: 45.0
    prerequisites:
      - "step_3_close_notebook"
